5.8412751346298" fill="none" stroke="#8798A3" stroke-width="4"/><rect x="50" y="150" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="76" y="195.52" text-anchor="start" font-size="32" fill="#235B79" font-weight="700">1 检查任务状态</text><text x="76" y="244.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">读取真实job与run记录</text><text x="76" y="284.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">区分完成失败取消和阻塞</text><rect x="770" y="150" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="796" y="195.52" text-anchor="start" font-size="32" fill="#3E7964" font-weight="700">2 对照交付物清单</text><text x="796" y="244.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">核对每样本和汇总产物</text><text x="796" y="284.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">保留缺失及未完成项</text><rect x="770" y="360" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#795E90" stroke-width="2"/><text x="796" y="405.52" text-anchor="start" font-size="32" fill="#795E90" font-weight="700">3 核对文件与身份</text><text x="796" y="454.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">检查格式表头行数及哈希</text><text x="796" y="494.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">确认产物对应当前输入</text><rect x="50" y="360" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#A16A31" stroke-width="2"/><text x="76" y="405.52" text-anchor="start" font-size="32" fill="#A16A31" font-weight="700">4 查看实际输出断言</text><text x="76" y="454.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">区分配置的自动验收</text><text x="76" y="494.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">与人工审阅或额外审计</text><rect x="50" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#456EA0" stroke-width="2"/><text x="76" y="615.52" text-anchor="start" font-size="32" fill="#456EA0" font-weight="700">5 评估方法质量</text><text x="76" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">结合分析对象与参考适用性</text><text x="76" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">不依赖单一长度或质量分数</text><rect x="770" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#976261" stroke-width="2"/><text x="796" y="615.52" text-anchor="start" font-size="32" fill="#976261" font-weight="700">6 检查统计解释</text><text x="796" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">核对单位重复和混杂</text><text x="796" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">报告效应不确定性及多重检验</text><rect x="770" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="796" y="825.52" text-anchor="start" font-size="32" fill="#235B79" font-weight="700">7 目视检查所有图像</text><text x="796" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">图例单位样本和标签一致</text><text x="796" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">保留最终图像指纹</text><rect x="50" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="76" y="825.52" text-anchor="start" font-size="32" fill="#3E7964" font-weight="700">8 导出可复现材料</text><text x="76" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">报告版本锁资源和参数</text><text x="76" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">如实列出限制和证据缺口</text><text x="60" y="999.06" text-anchor="start" font-size="21" fill="#536675" font-weight="400">编号仅用于本图阅读  •  不自动授权安装 下载或正式执行</text></g></svg>