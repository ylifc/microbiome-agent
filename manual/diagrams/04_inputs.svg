<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1120" width="1480" height="1120"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="64.12" text-anchor="start" font-size="42" fill="#1E2D38" font-weight="700">输入确认与路径角色</text><text x="60" y="101.92" text-anchor="start" font-size="22" fill="#536675" font-weight="400">Microbiome 0.2.5  |  关系示意图  |  精确状态与参数以实际接口回执为准</text><polyline points="580,575 555,575 555,250 530,250" fill="none" stroke="#235B79" stroke-width="4"/><rect x="40" y="140" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="64" y="188.66" text-anchor="start" font-size="31" fill="#235B79" font-weight="700">原始数据</text><text x="64" y="248.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">本地文件目录与清单优先</text><text x="64" y="295.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">按样本区分本地和远程</text><text x="64" y="342.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">原始内容保持只读</text><polyline points="580,575 555,575 555,552 530,552" fill="none" stroke="#3E7964" stroke-width="4"/><rect x="40" y="442" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="64" y="490.66" text-anchor="start" font-size="31" fill="#3E7964" font-weight="700">项目和输出</text><text x="64" y="550.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">项目保存配置与状态</text><text x="64" y="597.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">输出保存预检和生产产物</text><text x="64" y="644.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">工作区文字不是原始输入</text><polyline points="580,575 555,575 555,854 530,854" fill="none" stroke="#795E90" stroke-width="4"/><rect x="40" y="744" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#795E90" stroke-width="2"/><text x="64" y="792.66" text-anchor="start" font-size="31" fill="#795E90" font-weight="700">参考数据库</text><text x="64" y="852.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">持久根独立于软件环境</text><text x="64" y="899.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">按消费工具绑定运行入口</text><text x="64" y="946.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">参考获取和原始样本分开</text><polyline points="900,575 925,575 925,250 950,250" fill="none" stroke="#A16A31" stroke-width="4"/><rect x="950" y="140" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#A16A31" stroke-width="2"/><text x="974" y="188.66" text-anchor="start" font-size="31" fill="#A16A31" font-weight="700">相对路径与自动纠正</text><text x="974" y="248.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">以明确基准解释相对路径</text><text x="974" y="295.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">只采用唯一可核实的纠正</text><text x="974" y="342.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">歧义时展示具体候选</text><polyline points="900,575 925,575 925,552 950,552" fill="none" stroke="#456EA0" stroke-width="4"/><rect x="950" y="442" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#456EA0" stroke-width="2"/><text x="974" y="490.66" text-anchor="start" font-size="31" fill="#456EA0" font-weight="700">输入错误分类</text><text x="974" y="550.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">缺失权限和未挂载分别说明</text><text x="974" y="597.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">配对数量顺序和身份核对</text><text x="974" y="644.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">不以缺失本地文件推断下载</text><polyline points="900,575 925,575 925,854 950,854" fill="none" stroke="#976261" stroke-width="4"/><rect x="950" y="744" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#976261" stroke-width="2"/><text x="974" y="792.66" text-anchor="start" font-size="31" fill="#976261" font-weight="700">确认后的使用</text><text x="974" y="852.36" text-anchor="start" font-si