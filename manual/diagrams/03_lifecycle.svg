="#A16A31" font-weight="700">4 审阅与适用授权</text><text x="76" y="454.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">展示当前具体方案材料</text><text x="76" y="494.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">绑定真实确认或有效委托</text><rect x="50" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#456EA0" stroke-width="2"/><text x="76" y="615.52" text-anchor="start" font-size="32" fill="#456EA0" font-weight="700">5 批准范围内准备依赖</text><text x="76" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">复用 READY 软件和数据库</text><text x="76" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">缺失资源才进入准备阶段</text><rect x="770" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#976261" stroke-width="2"/><text x="796" y="615.52" text-anchor="start" font-size="32" fill="#976261" font-weight="700">6 代表性预检</text><text x="796" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">在隔离目录运行计划</text><text x="796" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">检查退出码及实际产物</text><rect x="770" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="796" y="825.52" text-anchor="start" font-size="32" fill="#235B79" font-weight="700">7 收尾与冻结</text><text x="796" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">复核通过证据和资源入口</text><text x="796" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">保存流程工具和数据库锁</text><rect x="50" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="76" y="825.52" text-anchor="start" font-size="32" fill="#3E7964" font-weight="700">8 全量执行授权与检查</text><text x="76" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">批准绑定当前冻结版本</text><text x="76" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">确认输入资源和磁盘状态</text>