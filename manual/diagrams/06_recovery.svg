<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1120" width="1480" height="1120"><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="60" y="64.12" text-anchor="start" font-size="42" fill="#1E2D38" font-weight="700">按失败位置恢复</text><text x="60" y="101.92" text-anchor="start" font-size="22" fill="#536675" font-weight="400">Microbiome 0.2.5  |  关系示意图  |  精确状态与参数以实际接口回执为准</text><polyline points="580,575 555,575 555,250 530,250" fill="none" stroke="#235B79" stroke-width="4"/><rect x="40" y="140" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="64" y="188.66" text-anchor="start" font-size="31" fill="#235B79" font-weight="700">输入声明失败</text><text x="64" y="248.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">检查路径角色与挂载权限</text><text x="64" y="295.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">修正声明并重新核验</text><text x="64" y="342.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">保留原消息与失败回执</text><polyline points="580,575 555,575 555,552 530,552" fill="none" stroke="#3E7964" stroke-width="4"/><rect x="40" y="442" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="64" y="490.66" text-anchor="start" font-size="31" fill="#3E7964" font-weight="700">候选格式失败</text><text x="64" y="550.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">利用字段和合同诊断修正</text><text x="64" y="597.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">使用持久候选与检查点</text><text x="64" y="644.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">服从每合同及总调用上限</text><polyline points="580,575 555,575 555,854 530,854" fill="none" stroke="#795E90" stroke-width="4"/><rect x="40" y="744" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#795E90" stroke-width="2"/><text x="64" y="792.66" text-anchor="start" font-size="31" fill="#795E90" font-weight="700">规划预算失败</text><text x="64" y="852.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">查看分段大小和有效策略</text><text x="64" y="899.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">去重与额度内技术调整</text><text x="64" y="946.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">不悄悄缩减用户目标</text><polyline points="900,575 925,575 925,250 950,250" fill="none" stroke="#A16A31" stroke-width="4"/><rect x="950" y="140" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#A16A31" stroke-width="2"/><text x="974" y="188.66" text-anchor="start" font-size="31" fill="#A16A31" font-weight="700">资源或环境失败</text><text x="974" y="248.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">区分未发现和实际不可用</text><text x="974" y="295.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">复用健康资源并限定修复</text><text x="974" y="342.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">生产期停止并另行维护</text><polyline points="900,575 925,575 925,552 950,552" fill="none" stroke="#456EA0" stroke-width="4"/><rect x="950" y="442" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#456EA0" stroke-width="2"/><text x="974" y="490.66" text-anchor="start" font-size="31" fill="#456EA0" font-weight="700">预检通过但收尾失败</text><text x="974" y="550.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">复用已有执行和验证事实</text><text x="974" y="597.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">只重试适用的冻结收尾</text><text x="974" y="644.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">避免再次执行科学命令</text><polyline points="900,575 925,575 925,854 950,854" fill="none" stroke="#976261" stroke-width="4"/><rect x="950" y="744" width="490" height="245" rx="18" fill="#F5F8FB" stroke="#976261" stroke-width="2"/><text x="974" y="792.66" text-anchor="start" font-size="31" fill="#976261" font-weight="700">执行或输出验收失败</text><text x="974" y="852.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">分开记录退出码和断言</text><text x="974" y="899.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">保留产物日志与原run ID</text><text x="974" y="946.36" text-anchor="start" font-size="26" fill="#1E2D38" font-weight="400">改变合同后重新验证授权</text><rect x="580" y="470" width="320" height="210" rx="18" fill="#163F56" stroke="#163F56" stroke-width="2"/><text x="740" y="548.38" text-anchor="middle" font-size="33" fill="white" font-weight="700">先保留真实事实</text><text x="740" y="606.38" text-anchor="middle" font-size="33" fill="white" font-weight="700">再选择恢复入口</text><text x="60" y="1104.06" text-anchor="start" font-size="21" fill="#536675" font-weight="400">编号仅用于本图阅读  •  不自动授权安装 下载或正式执行</text></g></svg>