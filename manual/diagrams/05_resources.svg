,865.8412751346298" fill="none" stroke="#8798A3" stroke-width="4"/><rect x="50" y="150" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="76" y="195.52" text-anchor="start" font-size="32" fill="#235B79" font-weight="700">1 先区分生产与维护</text><text x="76" y="244.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">生产只验锁 缺失或漂移即停止</text><text x="76" y="284.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">后续查找只用于生产前或维护</text><rect x="770" y="150" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="796" y="195.52" text-anchor="start" font-size="32" fill="#3E7964" font-weight="700">2 已验证 Registry</text><text x="796" y="244.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">读取 executable 和入口</text><text x="796" y="284.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">核对版本marker与指纹</text><rect x="770" y="360" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#795E90" stroke-width="2"/><text x="796" y="405.52" text-anchor="start" font-size="32" fill="#795E90" font-weight="700">3 既有 Skill 映射</text><text x="796" y="454.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">查名称别名与使用指引</text><text x="796" y="494.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">映射本身不是安装证明</text><rect x="50" y="360" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#A16A31" stroke-width="2"/><text x="76" y="405.52" text-anchor="start" font-size="32" fill="#A16A31" font-weight="700">4 所有既有 Conda 环境</text><text x="76" y="454.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">按实际能力探测</text><text x="76" y="494.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">环境名称不同也可复用</text><rect x="50" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#456EA0" stroke-width="2"/><text x="76" y="615.52" text-anchor="start" font-size="32" fill="#456EA0" font-weight="700">5 PATH 与项目软件目录</text><text x="76" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">验证实际程序路径</text><text x="76" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">保留环境和版本证据</text><rect x="770" y="570" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#976261" stroke-width="2"/><text x="796" y="615.52" text-anchor="start" font-size="32" fill="#976261" font-weight="700">6 Conda 元数据</text><text x="796" y="664.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">补全包名与能力关系</text><text x="796" y="704.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">避免重复创建健康环境</text><rect x="770" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#235B79" stroke-width="2"/><text x="796" y="825.52" text-anchor="start" font-size="32" fill="#235B79" font-weight="700">7 批准范围内准备</text><text x="796" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">BOOTSTRAP / PRETEST_REPAIR</text><text x="796" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">数据库使用持久数据库根</text><rect x="50" y="780" width="640" height="160" rx="18" fill="#F5F8FB" stroke="#3E7964" stroke-width="2"/><text x="76" y="825.52" text-anchor="start" font-size="32" fill="#3E7964" font-weight="700">8 验证后登记 READY</text><text x="76" y="874.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">版本帮助和调用能力检查</text><text x="76" y="914.22" text-anchor="start" font-size="27" fill="#1E2D38" font-weight="400">保存 Registry Skill Knowledge</text><text x="60" y="999.06" text-anchor="start" font-size="21" fill="#536675" font-weight="400">编号仅用于本图阅读  •  不自动授权安装 下载或正式执行</text></g></svg>